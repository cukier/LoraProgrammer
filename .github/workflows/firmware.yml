name: Firmware

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ESP-IDF 6.2 isn't published as a Docker tag yet (latest is v6.1 on
      # https://hub.docker.com/r/espressif/idf/tags). Bump this once it is.
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: 'src'

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            src/build/*.bin
            src/build/bootloader/bootloader.bin
            src/build/partition_table/partition-table.bin
          if-no-files-found: error
